<!DOCTYPE html>
<html>
<head>
<title>Flappy Kiranaku ❤️</title>

<style>
body{
  margin:0;
  text-align:center;
  font-family:Arial;
  background:#70c5ce;
}

canvas{
  display:block;
  margin:auto;
  background:#70c5ce;
}

button{
  padding:15px 30px;
  font-size:20px;
  border:0;
  border-radius:10px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="intro">
  <h1>🐦 Flappy Kiranaku ❤️</h1>
  <p>Fly through 4 pipes!</p>
  <button onclick="start()">START</button>
</div>

<canvas id="game" width="400" height="600" style="display:none"></canvas>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");

let bird,pipes,score,running;

function start(){

  document.getElementById("intro").style.display="none";
  c.style.display="block";

  bird={x:60,y:250,v:0};
  score=0;
  running=true;

  pipes=[];

  for(let i=0;i<4;i++){
    pipes.push({
      x:300+i*170,
      gap:Math.random()*200+170,
      passed:false
    });
  }

  loop();
}

function flap(){
  if(running) bird.v=-7;
}

document.onkeydown=e=>{
  if(e.code==="Space") flap();
};

c.onclick=flap;

function loop(){

  ctx.clearRect(0,0,400,600);

  /* Bird */
  ctx.font="30px Arial";
  ctx.fillText("🐦",bird.x,bird.y);

  /* Pipes */
  pipes.forEach(p=>{

    p.x-=3;

    ctx.fillStyle="#228B22";

    ctx.fillRect(
      p.x,
      0,
      50,
      p.gap-80
    );

    ctx.fillRect(
      p.x,
      p.gap+80,
      50,
      600
    );

    if(!p.passed && p.x+50<bird.x){
      p.passed=true;
      score++;
    }

    if(
      bird.x+25>p.x &&
      bird.x<p.x+50 &&
      (
        bird.y<p.gap-80 ||
        bird.y+20>p.gap+80
      )
    ){
      finish(false);
    }
  });

  /* Gravity */
  bird.v+=0.35;
  bird.y+=bird.v;

  if(bird.y<0 || bird.y>580){
    finish(false);
  }

  /* Score */
  ctx.fillStyle="white";
  ctx.font="25px Arial";
  ctx.fillText(score+"/4",15,35);

  /* Finished */
  if(score>=4){
    finish(true);
    return;
  }

  if(running)
    requestAnimationFrame(loop);
}


function finish(success){

  if(!running) return;

  running=false;

  /*
    GREEN BACKGROUND
  */
  ctx.fillStyle="#228B22";
  ctx.fillRect(0,0,400,600);

  /*
    FADED DARK BACKGROUND
  */
  ctx.fillStyle="rgba(0,0,0,0.55)";
  ctx.fillRect(0,0,400,600);

  /*
    MESSAGE
  */
  ctx.textAlign="center";
  ctx.fillStyle="white";

  ctx.font="30px Arial";

  if(success){
    ctx.fillText(
      "I LOVE YOU KIRANAKU ❤️",
      200,
      280
    );
  }else{
    ctx.fillText(
      "Please Try Again ❤️",
      200,
      280
    );
  }

  ctx.font="18px Arial";

  ctx.fillText(
    "Click to restart",
    200,
    325
  );

  c.onclick=()=>{
    location.reload();
  };
}
</script>

</body>
</html>
