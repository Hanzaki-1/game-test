<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Flappy Kiranaku ❤️</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  touch-action:none;
  background:#70c5ce;
}

/* INTRO */

#intro{
  width:100%;
  height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
}

#intro h1{
  font-size:30px;
  margin:0 0 10px;
}

#intro p{
  font-size:18px;
  margin:0 0 25px;
}

#startButton{
  padding:16px 35px;
  border:0;
  border-radius:12px;

  background:#ff4d6d;
  color:white;

  font-size:20px;
  font-weight:bold;
}

/* GAME */

#game{
  display:none;

  position:fixed;
  inset:0;

  width:100%;
  height:100%;
}

/* SCORE */

#score{
  display:none;

  position:fixed;
  top:15px;
  left:0;

  width:100%;

  text-align:center;

  color:white;
  font-size:25px;
  font-weight:bold;

  z-index:5;

  pointer-events:none;
}

/* END */

#ending{
  display:none;

  position:fixed;
  inset:0;

  z-index:20;

  background:
    linear-gradient(
      rgba(0,0,0,.55),
      rgba(0,0,0,.55)
    ),
    #228B22;

  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;
}

#endingMessage{
  width:100%;

  color:white;

  font-size:25px;
  font-weight:bold;

  line-height:1.5;

  text-align:center;
}

#restartText{
  margin-top:25px;

  color:white;

  font-size:16px;
}
</style>
</head>

<body>


<!-- INTRO -->

<div id="intro">

  <h1>🕊️ Flappy Kiranaku ❤️</h1>

  <p>Fly through 4 pipes!</p>

  <button id="startButton">
    START GAME
  </button>

</div>


<!-- GAME -->

<canvas id="game"></canvas>

<div id="score">
  0 / 4
</div>


<!-- ENDING -->

<div id="ending">

  <div id="endingMessage"></div>

  <div id="restartText">
    Tap to restart
  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const intro =
document.getElementById("intro");

const startButton =
document.getElementById("startButton");

const scoreElement =
document.getElementById("score");

const ending =
document.getElementById("ending");

const endingMessage =
document.getElementById("endingMessage");


/* =========================
   VARIABLES
========================= */

let W;
let H;

let bird;

let pipes=[];

let score=0;

let running=false;


/* =========================
   RESIZE
========================= */

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W;
  canvas.height=H;

}


/* =========================
   START
========================= */

function start(){

  /* prevent double start */

  if(running)return;

  resize();

  intro.style.display="none";

  canvas.style.display="block";

  scoreElement.style.display="block";

  ending.style.display="none";


  /* bird */

  bird={
    x:W*0.18,
    y:H*0.40,
    velocity:0
  };


  /* reset */

  score=0;

  scoreElement.innerText="0 / 4";

  pipes=[];


  /* create only 4 pipes */

  for(let i=0;i<4;i++){

    pipes.push({

      x:W+120+i*W*.75,

      gap:
        H*.42+
        Math.random()*H*.16,

      passed:false

    });

  }


  running=true;

  requestAnimationFrame(loop);

}


/* =========================
   START BUTTON
========================= */

startButton.addEventListener(
  "click",
  start
);


/* =========================
   FLAP
========================= */

function flap(e){

  if(e)e.preventDefault();

  if(!running)return;

  bird.velocity=-H*.012;

}


/* =========================
   GAME TOUCH
========================= */

canvas.addEventListener(
  "touchstart",
  flap,
  {passive:false}
);


/* =========================
   GAME CLICK
========================= */

canvas.addEventListener(
  "click",
  flap
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  function(e){

    if(e.code==="Space"){

      flap(e);

    }

  }
);


/* =========================
   GAME LOOP
========================= */

function loop(){

  if(!running)return;


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /* BIRD */

  ctx.font=
    Math.max(28,W*.08)
    +"px Arial";

  ctx.fillText(
    "🕊️",
    bird.x,
    bird.y
  );


  /* PIPES */

  for(let i=0;i<pipes.length;i++){

    const p=pipes[i];

    p.x-=W*.007;


    ctx.fillStyle="#228B22";


    /* top */

    ctx.fillRect(
      p.x,
      0,
      W*.12,
      p.gap-H*.13
    );


    /* bottom */

    ctx.fillRect(
      p.x,
      p.gap+H*.13,
      W*.12,
      H
    );


    /* score */

    if(
      !p.passed &&
      p.x+W*.12<bird.x
    ){

      p.passed=true;

      score++;

      scoreElement.innerText=
        score+" / 4";

    }


    /* collision */

    if(

      bird.x+W*.07>p.x &&

      bird.x<p.x+W*.12 &&

      (
        bird.y<p.gap-H*.13 ||

        bird.y+H*.05>
        p.gap+H*.13
      )

    ){

      finish(false);

      return;

    }

  }


  /* gravity */

  bird.velocity+=H*.0006;

  bird.y+=bird.velocity;


  /* screen boundary */

  if(
    bird.y<0 ||
    bird.y>H-H*.05
  ){

    finish(false);

    return;

  }


  /* WIN */

  if(score>=4){

    finish(true);

    return;

  }


  requestAnimationFrame(loop);

}


/* =========================
   FINISH
========================= */

function finish(success){

  if(!running)return;

  running=false;


  canvas.style.display="none";

  scoreElement.style.display="none";

  ending.style.display="flex";


  if(success){

    endingMessage.innerHTML=
      "I LOVE YOU<br>KIRANAKU ❤️";

  }else{

    endingMessage.innerHTML=
      "Please Try Again ❤️";

  }

}


/* =========================
   RESTART
========================= */

ending.addEventListener(
  "click",
  function(){

    ending.style.display="none";

    start();

  }
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  resize
);

</script>

</body>
</html>
