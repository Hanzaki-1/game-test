<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flappy Kiranaku ❤️</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#70c5ce;
  font-family:Arial;
  touch-action:none;
}

#intro{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

button{
  padding:15px 35px;
  border:0;
  border-radius:12px;
  background:#ff4d6d;
  color:white;
  font-size:20px;
}

#game{
  display:none;
  width:100%;
  height:100%;
}
</style>
</head>

<body>

<div id="intro">
  <h1>🐦 Flappy Kiranaku ❤️</h1>
  <p>Fly through 4 pipes!</p>
  <button onclick="start()">START GAME</button>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,bird,pipes,score,running;


/* SCREEN */

function resize(){

  W=window.innerWidth;
  H=window.innerHeight;

  canvas.width=W;
  canvas.height=H;

}

resize();


/* START */

function start(){

  document.getElementById("intro").style.display="none";
  canvas.style.display="block";

  resize();

  bird={
    x:W*.18,
    y:H*.4,
    v:0
  };

  score=0;
  running=true;
  pipes=[];

  for(let i=0;i<4;i++){

    pipes.push({
      x:W+100+i*W*.75,
      gap:H*.45+Math.random()*H*.12,
      passed:false
    });

  }

  canvas.onclick=flap;
  canvas.ontouchstart=flap;

  loop();
}


/* FLAP */

function flap(e){

  if(e)e.preventDefault();

  if(running)
    bird.v=-H*.012;

}


/* KEYBOARD */

document.addEventListener("keydown",e=>{
  if(e.code==="Space") flap();
});


/* GAME */

function loop(){

  if(!running)return;

  ctx.clearRect(0,0,W,H);


  /* BIRD */

  ctx.font=Math.max(28,W*.08)+"px Arial";
  ctx.fillText("🐦",bird.x,bird.y);


  /* PIPES */

  pipes.forEach(p=>{

    p.x-=W*.007;

    ctx.fillStyle="#228B22";

    ctx.fillRect(
      p.x,
      0,
      W*.12,
      p.gap-H*.13
    );

    ctx.fillRect(
      p.x,
      p.gap+H*.13,
      W*.12,
      H
    );


    if(!p.passed && p.x+W*.12<bird.x){

      p.passed=true;
      score++;

    }


    /* COLLISION */

    if(
      bird.x+W*.07>p.x &&
      bird.x<p.x+W*.12 &&
      (
        bird.y<p.gap-H*.13 ||
        bird.y+H*.05>p.gap+H*.13
      )
    ){

      finish(false);

    }

  });


  /* GRAVITY */

  bird.v+=H*.0006;
  bird.y+=bird.v;


  if(bird.y<0 || bird.y>H-H*.05){

    finish(false);

  }


  /* SCORE */

  ctx.fillStyle="white";
  ctx.textAlign="left";
  ctx.font="bold 24px Arial";
  ctx.fillText(score+"/4",20,40);


  /* WIN */

  if(score>=4){

    finish(true);
    return;

  }

  requestAnimationFrame(loop);
}


/* END */

function finish(success){

  if(!running)return;

  running=false;


  /* GREEN */

  ctx.fillStyle="#228B22";
  ctx.fillRect(0,0,W,H);


  /* DARK FADE */

  ctx.fillStyle="rgba(0,0,0,.55)";
  ctx.fillRect(0,0,W,H);


  /*
    CENTER TEXT
  */

  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle="white";


  /* SMALL PHONE-SAFE SIZE */

  let size=Math.min(24,W*.055);

  ctx.font="bold "+size+"px Arial";


  if(success){

    /* TWO LINES */

    ctx.fillText(
      "I LOVE YOU",
      W/2,
      H/2-25
    );

    ctx.fillText(
      "KIRANAKU ❤️",
      W/2-10,
      H/2-10
    );

  }else{

    ctx.fillText(
      "Please Try Again ❤️",
      W/2-20,
      H/2-10
    );

  }


  /* RESTART */

  ctx.font="16px Arial";

  ctx.fillText(
    "Tap to restart",
    W/2,
    H/2+55
  );


  canvas.onclick=restart;
  canvas.ontouchstart=restart;

}


/* RESTART */

function restart(e){

  if(e)e.preventDefault();

  canvas.onclick=null;
  canvas.ontouchstart=null;

  start();

}

</script>

</body>
</html>
