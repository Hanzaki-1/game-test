<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Flappy Kiranaku ❤️</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  touch-action:none;
  background:#70c5ce;
}


/* =========================
   INTRO SCREEN
========================= */

#intro{
  width:100%;
  height:100vh;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  text-align:center;

  background:#70c5ce;
}

#intro h1{
  font-size:30px;
  margin-bottom:10px;
}

#intro p{
  font-size:18px;
  margin-bottom:25px;
}

#startButton{
  padding:16px 35px;

  border:none;
  border-radius:12px;

  background:#ff4d6d;
  color:white;

  font-size:20px;
  font-weight:bold;
}


/* =========================
   GAME
========================= */

#game{
  display:none;

  position:fixed;
  left:0;
  top:0;

  width:100%;
  height:100%;

  background:#70c5ce;
}


/* =========================
   ENDING SCREEN
========================= */

#ending{

  display:none;

  position:fixed;

  left:0;
  top:0;

  width:100%;
  height:100%;

  z-index:10;

  background:
    linear-gradient(
      rgba(0,0,0,.55),
      rgba(0,0,0,.55)
    ),
    #228B22;

  flex-direction:column;

  justify-content:center;
  align-items:center;

  text-align:center;

  padding:20px;
}


/* MAIN ENDING MESSAGE */

#endingMessage{

  width:100%;

  text-align:center;

  color:white;

  font-size:25px;

  font-weight:bold;

  line-height:1.5;

}


/* RESTART */

#restartText{

  margin-top:25px;

  color:white;

  font-size:16px;

}


/* SCORE */

#score{

  position:fixed;

  top:15px;
  left:0;

  width:100%;

  text-align:center;

  color:white;

  font-size:25px;

  font-weight:bold;

  z-index:5;

  pointer-events:none;
}

</style>

</head>


<body>


<!-- =========================
     INTRO
========================= -->

<div id="intro">

  <h1>🕊️ Flappy Kiranaku ❤️</h1>

  <p>Fly through 4 pipes!</p>

  <button id="startButton">
    START GAME
  </button>

</div>


<!-- =========================
     GAME
========================= -->

<canvas id="game"></canvas>

<div id="score">
  0 / 4
</div>


<!-- =========================
     ENDING
========================= -->

<div id="ending">

  <div id="endingMessage"></div>

  <div id="restartText">
    Tap to restart
  </div>

</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");


/* =========================
   ELEMENTS
========================= */

const intro =
  document.getElementById("intro");

const startButton =
  document.getElementById("startButton");

const ending =
  document.getElementById("ending");

const endingMessage =
  document.getElementById("endingMessage");

const scoreText =
  document.getElementById("score");


/* =========================
   VARIABLES
========================= */

let W;
let H;

let bird;

let pipes = [];

let score = 0;

let running = false;


/* =========================
   SCREEN SIZE
========================= */

function resize(){

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W;
  canvas.height = H;

}

resize();

window.addEventListener(
  "resize",
  resize
);


/* =========================
   START GAME
========================= */

function start(){

  intro.style.display="none";

  canvas.style.display="block";

  ending.style.display="none";

  resize();


  bird = {

    x: W * 0.18,

    y: H * 0.40,

    velocity: 0

  };


  score = 0;

  pipes = [];

  running = true;


  scoreText.innerText="0 / 4";


  /*
    CREATE 4 PIPES
  */

  for(let i=0;i<4;i++){

    pipes.push({

      x: W + 100 + i * W * 0.75,

      gap:
        H * 0.42 +
        Math.random() * H * 0.18,

      passed:false

    });

  }


  loop();

}


/* =========================
   BIRD FLAP
========================= */

function flap(event){

  if(event){

    event.preventDefault();

  }

  if(!running)return;

  bird.velocity =
    -H * 0.012;

}


/* =========================
   TOUCH
========================= */

canvas.addEventListener(
  "touchstart",
  flap,
  {passive:false}
);


/* =========================
   MOUSE
========================= */

canvas.addEventListener(
  "click",
  flap
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.code==="Space"){

      flap(event);

    }

  }
);


/* =========================
   GAME LOOP
========================= */

function loop(){

  if(!running)return;


  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  /* =====================
     BIRD
  ===================== */

  ctx.font =
    Math.max(28,W*0.08)
    + "px Arial";

  ctx.fillText(
    "🕊️",
    bird.x,
    bird.y
  );


  /* =====================
     PIPES
  ===================== */

  pipes.forEach(function(pipe){

    pipe.x -= W * 0.007;


    /*
      TOP PIPE
    */

    ctx.fillStyle =
      "#228B22";

    ctx.fillRect(

      pipe.x,

      0,

      W * 0.12,

      pipe.gap - H * 0.13

    );


    /*
      BOTTOM PIPE
    */

    ctx.fillRect(

      pipe.x,

      pipe.gap + H * 0.13,

      W * 0.12,

      H

    );


    /*
      SCORE
    */

    if(
      !pipe.passed &&
      pipe.x + W*0.12 < bird.x
    ){

      pipe.passed = true;

      score++;

      scoreText.innerText =
        score + " / 4";

    }


    /*
      COLLISION
    */

    if(

      bird.x + W*0.07 > pipe.x &&

      bird.x <
      pipe.x + W*0.12 &&

      (

        bird.y <
        pipe.gap - H*0.13

        ||

        bird.y + H*0.05 >
        pipe.gap + H*0.13

      )

    ){

      finish(false);

    }

  });


  /* =====================
     GRAVITY
  ===================== */

  bird.velocity +=
    H * 0.0006;

  bird.y +=
    bird.velocity;


  /* =====================
     OUT OF SCREEN
  ===================== */

  if(

    bird.y < 0 ||

    bird.y >
    H - H*0.05

  ){

    finish(false);

  }


  /* =====================
     WIN
  ===================== */

  if(score >= 4){

    finish(true);

    return;

  }


  requestAnimationFrame(loop);

}


/* =========================
   FINISH
========================= */

function finish(success){

  if(!running)return;

  running=false;


  /*
    HIDE GAME
  */

  canvas.style.display="none";

  scoreText.style.display="none";


  /*
    SHOW ENDING
  */

  ending.style.display="flex";


  if(success){

    endingMessage.innerHTML =
      "I LOVE YOU<br>KIRANAKU ❤️";

  }else{

    endingMessage.innerHTML =
      "Please Try Again ❤️";

  }

}


/* =========================
   RESTART
========================= */

function restart(){

  ending.style.display="none";

  scoreText.style.display="block";

  start();

}


/* =========================
   ENDING CLICK
========================= */

ending.addEventListener(
  "click",
  restart
);


ending.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

    restart();

  },
  {passive:false}
);


/* =========================
   START BUTTON
========================= */

startButton.addEventListener(
  "click",
  start
);


startButton.addEventListener(
  "touchstart",
  function(event){

    event.preventDefault();

    start();

  },
  {passive:false}
);

</script>

</body>
</html>
